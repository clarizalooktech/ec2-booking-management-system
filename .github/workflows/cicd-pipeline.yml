name: Deploy Django Application To EC2

on:
  push:
    branches:
      - feature/create-cicd-pipeline

jobs:
  build-docker-setup-infra:
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.wait-for-instance.outputs.instance_ip }}

    env:
      REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
      CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ap-southeast-2
      IMAGE_TAG: 1.1.0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Build and Push Docker Images
        env:
          DOCKER_REGISTRY: ${{ secrets.ECR_REPOSITORY_URI }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          # Build the application image
          docker build -t django-booking-app:latest .

          # Tag with commit hash (last 7 characters) and latest
          docker tag django-booking-app:latest ${{ secrets.ECR_REPOSITORY_URI }}:${COMMIT_HASH::7}

          # Push to ECR
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:${COMMIT_HASH::7}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements.txt

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Deploy CDK Stack
        working-directory: ./infra
        run: cdk deploy --require-approval never

      - name: Wait for EC2 Instance to be Ready
        id: wait-for-instance
        run: |
          # Get the instance ID from CDK outputs
          STACK_OUTPUTS=$(aws cloudformation describe-stacks --stack-name Ec2-Booking-Management-Stack --query "Stacks[0].Outputs" --output json)
          INSTANCE_ID=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="InstanceId") | .OutputValue')
          INSTANCE_IP=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="InstancePublicIp") | .OutputValue')

          # Fallback to searching by tag if outputs aren't available
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "null" ]; then
            echo "Looking up instance by tag..."
            INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=DjangoInstance" "Name=instance-state-name,Values=pending,running" --query "Reservations[0].Instances[0].InstanceId" --output text)

            if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
              echo "Error: No running EC2 instance with tag 'DjangoInstance' found."
              exit 1
            fi

            INSTANCE_IP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          fi

          echo "Found instance $INSTANCE_ID with IP $INSTANCE_IP"
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

  deploy:
    needs: build-docker-setup-infra
    runs-on: ubuntu-latest

    env:
      REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install SSH Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Create .ssh Directory
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Add SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -lf ~/.ssh/id_rsa || echo "Key verification failed"

      - name: Create .env file
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: ${{ vars.DEBUG }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-2
        run: |
          cat << EOF > .env
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DJANGO_SETTINGS_MODULE=booking_management.settings
          DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
          SECRET_KEY=${DJANGO_SECRET_KEY}
          DEBUG=${DEBUG}
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          TIME_ZONE=${TIME_ZONE}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
          EOF

      - name: Copy Docker Compose Files
        env:
          INSTANCE_IP: ${{ needs.build-docker-setup-infra.outputs.instance_ip }}
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no docker-compose.yml ec2-user@${INSTANCE_IP}:~/
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no .env ec2-user@${INSTANCE_IP}:~/

      - name: SSH into EC2 and Deploy Application
        env:
          INSTANCE_IP: ${{ needs.build-docker-setup-infra.outputs.instance_ip }}
          REPO_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ec2-user@${INSTANCE_IP} "
            # Wait for Docker
            echo 'Waiting for Docker to be available...'
            until sudo docker info > /dev/null 2>&1; do
              sleep 5
            done
            echo 'Docker is ready'

            # Login to ECR
            aws ecr get-login-password --region ap-southeast-2 | sudo docker login --username AWS --password-stdin ${REPO_URI}

            # Stop existing containers
            sudo docker compose down || true

            # Pull all images
            sudo docker compose pull

            # Start all containers
            sudo docker compose up -d

            # Clean up old images
            sudo docker image prune -f

            # Output application URL
            echo 'Application deployed successfully!'
            echo 'Access the application at: http://'$(curl -s ifconfig.me):8001
          "